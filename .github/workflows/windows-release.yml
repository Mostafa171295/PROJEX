name: Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-latest
  cancel-in-progress: false

jobs:
  test:
    name: Restore, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json
      - name: Restore
        run: dotnet restore Projex.slnx
      - name: Build
        run: dotnet build Projex.slnx --configuration Release --no-restore
      - name: Run .NET tests
        run: dotnet test Projex.slnx --configuration Release --no-build --logger "trx;LogFileName=projex-tests.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projex-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn
          retention-days: 14

  publish-windows:
    name: Publish single Windows ZIP
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json
      - name: Restore
        run: dotnet restore Projex.slnx
      - name: Publish Desktop client (self-contained win-x64)
        run: >
          dotnet publish src/Projex.Desktop/Projex.Desktop.csproj
          --configuration Release --runtime win-x64 --self-contained true
          --output artifacts/package/Desktop -p:DebugType=None -p:DebugSymbols=false
      - name: Publish API server (self-contained win-x64)
        run: >
          dotnet publish src/Projex.Api/Projex.Api.csproj
          --configuration Release --runtime win-x64 --self-contained true
          --output artifacts/package/Server/API -p:DebugType=None -p:DebugSymbols=false
      - name: Publish Server Control Center (self-contained win-x64)
        run: >
          dotnet publish src/Projex.ServerManager/Projex.ServerManager.csproj
          --configuration Release --runtime win-x64 --self-contained true
          --output artifacts/package/Server/Manager -p:DebugType=None -p:DebugSymbols=false
      - name: Stage server administration payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/package/Server/Scripts, artifacts/package/Server/Docs, artifacts/package/Server/Database/Migrations | Out-Null
          Copy-Item scripts/Install-ProjexApiService.ps1, scripts/Uninstall-ProjexApiService.ps1, scripts/Test-ProjexApiService.ps1, scripts/Initialize-ProjexDatabase.ps1, scripts/Install-PROJEX-Local.ps1, scripts/Install-PROJEX-Server.ps1, scripts/Backup-ProjexDatabase.ps1, scripts/Restore-ProjexDatabase.ps1, scripts/Register-ProjexBackupTask.ps1, scripts/migrate.ps1, scripts/Enable-PROJEX-RemoteAccess.ps1, scripts/Disable-PROJEX-RemoteAccess.ps1 -Destination artifacts/package/Server/Scripts
          Copy-Item scripts/Install-PROJEX-Client.ps1 -Destination artifacts/package
          Copy-Item database/migrations/*.sql -Destination artifacts/package/Server/Database/Migrations
          Copy-Item docs/deployment/WINDOWS_HOME_SERVER.md, docs/deployment/POSTGRES_BACKUP_RESTORE.md, docs/deployment/PRODUCT_REQUIREMENTS.md, docs/deployment/CLIENT_SERVER_ARCHITECTURE.md -Destination artifacts/package/Server/Docs
      - name: Add launch helper and package instructions
        shell: pwsh
        run: |
          @'
          @echo off
          cd /d "%~dp0Desktop"
          start "" "Projex.Desktop.exe"
          '@ | Set-Content -Encoding ascii artifacts/package/Start-PROJEX.bat

          @'
          PROJEX ENTERPRISE - Windows x64 package

          CLIENT
          Run Start-PROJEX.bat or Desktop\Projex.Desktop.exe on each user workstation.
          In PROJEX connection settings, enter the server HTTPS address. Client devices do not need PostgreSQL or the API service.

          DEDICATED SERVER
          Run Server\\Manager\\Projex.ServerManager.exe as Administrator. Run server setup installs PostgreSQL 16 automatically when it is missing (using Microsoft winget and the verified PostgreSQL package), or reuses an existing PostgreSQL 16 service. An Internet connection and Windows App Installer are required for first-time database installation.
          Run Server\Manager\Projex.ServerManager.exe as Administrator.
          Use Run server setup to create the database, apply migrations, and install the PROJEX API Windows Service.
          The manager provides API service controls, PostgreSQL service status, API liveness/readiness checks, and maintenance shortcuts.

          MULTI-DEVICE SECURITY
          The API starts in loopback-only mode. On the dedicated server, run Server\Manager\Projex.ServerManager.exe as Administrator and choose Enable secure LAN access. The wizard requires a trusted PFX certificate, a DNS name that resolves to the server, and the private client subnet. It configures an HTTPS listener and a subnet-scoped Windows Firewall rule.
          Install the issuing certificate authority on each client device and use the HTTPS address shown by the wizard. Plan certificate renewal before expiry.
          Never expose PostgreSQL port 5432 or the local API HTTP port to client devices or the public Internet. Choose Disable secure LAN access to return to loopback-only mode.

          REQUIREMENTS
          Windows 10/11 x64; Windows 11 recommended. Entry target: 8 GB RAM and SSD; recommended: 16 GB RAM and SSD. No separate .NET runtime installation is required.
          See Server\Docs\CLIENT_SERVER_ARCHITECTURE.md and PRODUCT_REQUIREMENTS.md.
          '@ | Set-Content -Encoding utf8 artifacts/package/README-RUN.txt
      - name: Create and validate the single ZIP
        shell: pwsh
        run: |
          $zip = "artifacts/PROJEX-Windows-win-x64.zip"
          Compress-Archive -Path "artifacts/package/*" -DestinationPath $zip -CompressionLevel Optimal
          if (!(Test-Path $zip)) { throw "ZIP package was not created." }
          foreach ($required in @(
            "artifacts/package/Desktop/Projex.Desktop.exe",
            "artifacts/package/Server/API/Projex.Api.exe",
            "artifacts/package/Server/Manager/Projex.ServerManager.exe",
            "artifacts/package/Server/Scripts/Install-PROJEX-Local.ps1",\n            "artifacts/package/Server/Scripts/Install-PROJEX-Server.ps1",\n            "artifacts/package/Install-PROJEX-Client.ps1",
            "artifacts/package/Server/Docs/CLIENT_SERVER_ARCHITECTURE.md"
          )) {
            if (!(Test-Path $required)) { throw "Required package file is missing: $required" }
          }
          $assets = @(Get-ChildItem artifacts -File)
          if ($assets.Count -ne 1 -or $assets[0].Name -ne "PROJEX-Windows-win-x64.zip") {
            throw "The release staging directory must contain exactly one ZIP asset."
          }
      - name: Move stable latest tag to the validated commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          git tag --force latest $env:GITHUB_SHA
          git push --force origin refs/tags/latest

      - name: Publish or update the single latest release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: PROJEX — Latest
          body: |
            This release is automatically replaced after successful validation of the latest main branch.

            Download the single Windows x64 package: PROJEX-Windows-win-x64.zip.
            It contains the desktop client, dedicated server API, Server Control Center, setup scripts, database migrations, and deployment documentation.
          draft: false
          prerelease: true
          overwrite_files: true
          files: artifacts/PROJEX-Windows-win-x64.zip
      - name: Enforce the single ZIP release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assetNames = @(gh release view latest --json assets --jq '.assets[].name')
          foreach ($asset in $assetNames) {
            if ($asset -ne "PROJEX-Windows-win-x64.zip") {
              gh release delete-asset latest $asset --yes
              if ($LASTEXITCODE -ne 0) { throw "Could not remove unexpected release asset '$asset'." }
            }
          }
          if ($assetNames -notcontains "PROJEX-Windows-win-x64.zip") {
            throw "The latest release does not contain the required PROJEX ZIP."
          }

      - name: Remove superseded releases and version tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $oldReleaseTags = @(gh release list --limit 1000 --json tagName --jq '.[] | select(.tagName != "latest") | .tagName')
          foreach ($tag in $oldReleaseTags) {
            if (![string]::IsNullOrWhiteSpace($tag)) {
              gh release delete $tag --yes --cleanup-tag
              if ($LASTEXITCODE -ne 0) { throw "Could not remove superseded release/tag '$tag'." }
            }
          }

          $remainingTags = @(git ls-remote --tags --refs origin | ForEach-Object { ($_ -split '\s+')[1] -replace '^refs/tags/', '' } | Where-Object { $_ -ne "latest" })
          foreach ($tag in $remainingTags) {
            git push origin --delete $tag
            if ($LASTEXITCODE -ne 0) { throw "Could not remove superseded version tag '$tag'." }
          }
