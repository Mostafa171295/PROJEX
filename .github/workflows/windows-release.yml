name: Windows Package

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-latest
  cancel-in-progress: false

jobs:
  test:
    name: Restore, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json
      - name: Restore
        run: dotnet restore Projex.slnx
      - name: Build
        run: dotnet build Projex.slnx --configuration Release --no-restore
      - name: Run .NET tests
        run: dotnet test Projex.slnx --configuration Release --no-build --logger "trx;LogFileName=projex-tests.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projex-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn
          retention-days: 14

  package-windows:
    name: Build single Windows ZIP
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json
      - name: Restore
        run: dotnet restore Projex.slnx
      - name: Publish Desktop client (self-contained win-x64)
        run: >
          dotnet publish src/Projex.Desktop/Projex.Desktop.csproj
          --configuration Release --runtime win-x64 --self-contained true
          --output artifacts/package/Desktop -p:DebugType=None -p:DebugSymbols=false
      - name: Publish API server (self-contained win-x64)
        run: >
          dotnet publish src/Projex.Api/Projex.Api.csproj
          --configuration Release --runtime win-x64 --self-contained true
          --output artifacts/package/Server/API -p:DebugType=None -p:DebugSymbols=false
      - name: Publish Server Control Center (self-contained win-x64)
        run: >
          dotnet publish src/Projex.ServerManager/Projex.ServerManager.csproj
          --configuration Release --runtime win-x64 --self-contained true
          --output artifacts/package/Server/Manager -p:DebugType=None -p:DebugSymbols=false
      - name: Stage server administration payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/package/Server/Scripts, artifacts/package/Server/Docs, artifacts/package/Server/Database/Migrations | Out-Null
          Copy-Item scripts/Install-ProjexApiService.ps1, scripts/Uninstall-ProjexApiService.ps1, scripts/Test-ProjexApiService.ps1, scripts/Initialize-ProjexDatabase.ps1, scripts/Install-PROJEX-Local.ps1, scripts/Install-PROJEX-Server.ps1, scripts/Backup-ProjexDatabase.ps1, scripts/Restore-ProjexDatabase.ps1, scripts/Register-ProjexBackupTask.ps1, scripts/migrate.ps1, scripts/Enable-PROJEX-RemoteAccess.ps1, scripts/Disable-PROJEX-RemoteAccess.ps1 -Destination artifacts/package/Server/Scripts
          Copy-Item scripts/Install-PROJEX-Client.ps1 -Destination artifacts/package
          Copy-Item database/migrations/*.sql -Destination artifacts/package/Server/Database/Migrations
          Copy-Item docs/deployment/WINDOWS_HOME_SERVER.md, docs/deployment/POSTGRES_BACKUP_RESTORE.md, docs/deployment/PRODUCT_REQUIREMENTS.md, docs/deployment/CLIENT_SERVER_ARCHITECTURE.md -Destination artifacts/package/Server/Docs
      - name: Add launch helper and package instructions
        shell: pwsh
        run: |
          @'
          @echo off
          cd /d "%~dp0Desktop"
          start "" "Projex.Desktop.exe"
          '@ | Set-Content -Encoding ascii artifacts/package/Start-PROJEX.bat

          @'
          PROJEX ENTERPRISE - Windows x64 package

          CLIENT
          Run PowerShell as Administrator and execute .\Install-PROJEX-Client.ps1 to install only the desktop client and create shortcuts.
          In PROJEX connection settings, enter the server HTTPS address. Client devices do not need PostgreSQL or the API service.

          DEDICATED SERVER
          Run Server\Manager\Projex.ServerManager.exe as Administrator. Run server setup installs PostgreSQL 16 automatically when it is missing through Microsoft WinGet, or reuses an existing PostgreSQL 16 service. An Internet connection and Windows App Installer are required for first-time database installation.
          Use Run server setup to create the database, apply migrations, and install the PROJEX API Windows Service.
          The manager provides API service controls, PostgreSQL service status, API liveness/readiness checks, and maintenance shortcuts.

          MULTI-DEVICE SECURITY
          The API starts in loopback-only mode. On the dedicated server, run Server\Manager\Projex.ServerManager.exe as Administrator and choose Enable secure LAN access. The wizard requires a trusted PFX certificate, a DNS name that resolves to the server, and the private client subnet. It configures an HTTPS listener and a subnet-scoped Windows Firewall rule.
          Install the issuing certificate authority on each client device and use the HTTPS address shown by the wizard. Plan certificate renewal before expiry.
          Never expose PostgreSQL port 5432 or the local API HTTP port to client devices or the public Internet. Choose Disable secure LAN access to return to loopback-only mode.

          REQUIREMENTS
          Windows 10/11 x64; Windows 11 recommended. Entry target: 8 GB RAM and SSD; recommended: 16 GB RAM and SSD. No separate .NET runtime installation is required.
          See Server\Docs\CLIENT_SERVER_ARCHITECTURE.md and PRODUCT_REQUIREMENTS.md.
          '@ | Set-Content -Encoding utf8 artifacts/package/README-RUN.txt
      - name: Validate direct package contents
        shell: pwsh
        run: |
          if (!(Test-Path "artifacts/package/Desktop/Projex.Desktop.exe")) { throw "Desktop executable is missing." }
          foreach ($required in @(
            "artifacts/package/Desktop/Projex.Desktop.exe",
            "artifacts/package/Server/API/Projex.Api.exe",
            "artifacts/package/Server/Manager/Projex.ServerManager.exe",
            "artifacts/package/Server/Scripts/Install-PROJEX-Local.ps1",
            "artifacts/package/Server/Scripts/Install-PROJEX-Server.ps1",
            "artifacts/package/Install-PROJEX-Client.ps1",
            "artifacts/package/Server/Docs/CLIENT_SERVER_ARCHITECTURE.md"
          )) {
            if (!(Test-Path $required)) { throw "Required package file is missing: $required" }
          }
          $nestedArchives = @(Get-ChildItem artifacts/package -Recurse -File -Include *.zip,*.7z,*.rar)
          if ($nestedArchives.Count -gt 0) { throw "Nested archives are not allowed in the downloadable package." }
      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: PROJEX-Windows-win-x64
          path: artifacts/package/**
          if-no-files-found: error
          retention-days: 14
