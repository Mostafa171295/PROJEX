name: Windows Package

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-latest
  cancel-in-progress: false

jobs:
  test:
    name: Restore, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json
      - name: Restore
        run: dotnet restore Projex.slnx
      - name: Build
        run: dotnet build Projex.slnx --configuration Release --no-restore
      - name: Run .NET tests
        run: dotnet test Projex.slnx --configuration Release --no-build --logger "trx;LogFileName=projex-tests.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projex-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn
          retention-days: 14

  package-windows:
    name: Build Windows package
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write   # needed only to publish the rolling "latest" release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json
      - name: Restore
        run: dotnet restore Projex.slnx
      - name: Publish Desktop client (self-contained win-x64)
        run: >
          dotnet publish src/Projex.Desktop/Projex.Desktop.csproj
          --configuration Release --runtime win-x64 --self-contained true
          --output artifacts/package/Clients/Desktop -p:DebugType=None -p:DebugSymbols=false
      - name: Publish API server (self-contained win-x64)
        run: >
          dotnet publish src/Projex.Api/Projex.Api.csproj
          --configuration Release --runtime win-x64 --self-contained true
          --output artifacts/package/Server/API -p:DebugType=None -p:DebugSymbols=false
      - name: Publish Server Control Center (self-contained win-x64)
        run: >
          dotnet publish src/Projex.ServerManager/Projex.ServerManager.csproj
          --configuration Release --runtime win-x64 --self-contained true
          --output artifacts/package/Server/Manager -p:DebugType=None -p:DebugSymbols=false
      - name: Stage server administration payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/package/Server/Scripts, artifacts/package/Server/Docs, artifacts/package/Server/Settings, artifacts/package/Server/Database/Migrations, artifacts/package/Clients | Out-Null
          Copy-Item scripts/Install-ProjexApiService.ps1, scripts/Uninstall-ProjexApiService.ps1, scripts/Test-ProjexApiService.ps1, scripts/Initialize-ProjexDatabase.ps1, scripts/Install-PROJEX-Local.ps1, scripts/Install-PROJEX-Server.ps1, scripts/Backup-ProjexDatabase.ps1, scripts/Restore-ProjexDatabase.ps1, scripts/Register-ProjexBackupTask.ps1, scripts/migrate.ps1, scripts/Enable-PROJEX-RemoteAccess.ps1, scripts/Disable-PROJEX-RemoteAccess.ps1 -Destination artifacts/package/Server/Scripts
          Copy-Item scripts/Install-PROJEX-Client.ps1 -Destination artifacts/package/Clients
          Copy-Item installer/Clients/Setup-Client.bat -Destination artifacts/package/Clients
          Set-Content -Encoding utf8 artifacts/package/Server/Settings/README.txt -Value "PROJEX server settings and setup logs are stored in this folder. Do not delete it."
          Copy-Item database/migrations/*.sql -Destination artifacts/package/Server/Database/Migrations
          Copy-Item docs/deployment/WINDOWS_HOME_SERVER.md, docs/deployment/POSTGRES_BACKUP_RESTORE.md, docs/deployment/PRODUCT_REQUIREMENTS.md, docs/deployment/CLIENT_SERVER_ARCHITECTURE.md -Destination artifacts/package/Server/Docs
      - name: Add launch helper and package instructions
        shell: pwsh
        run: |
          @'
          @echo off
          setlocal
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "try { Invoke-WebRequest -Uri 'http://127.0.0.1:5080/health/ready' -UseBasicParsing -TimeoutSec 3 | Out-Null; exit 0 } catch { exit 1 }"
          if errorlevel 1 (
            echo PROJEX local API/database is not ready yet.
            echo Opening Server Control Center. Run step 1 then step 2 and wait for the green status.
            start "" "%~dp0Server\Manager\Projex.ServerManager.exe"
            echo After setup succeeds, run Start-PROJEX.bat again.
            exit /b 1
          )
          start "" "%~dp0Clients\Desktop\Projex.Desktop.exe"
          '@ | Set-Content -Encoding ascii artifacts/package/Start-PROJEX.bat

          @'
          @echo off
          start "" "%~dp0Server\Manager\Projex.ServerManager.exe"
          '@ | Set-Content -Encoding ascii artifacts/package/Start-PROJEX-Server-Setup.bat

          @'
          PROJEX ENTERPRISE - Windows x64 package

          FOLDERS
          Server\   everything for the server computer (Manager, API, Settings, Database, Docs).
          Clients\  everything a client computer needs (Desktop program + Setup-Client.bat).

          SINGLE COMPUTER - FIRST RUN
          1. Double-click Start-PROJEX-Server-Setup.bat and approve the Windows administrator prompt.
          2. Open "Database and setup" in Server Control Center. Press step 1 to download and install PostgreSQL 16 automatically (needs Internet and Microsoft's App Installer / WinGet). If PostgreSQL 16 already exists, step 1 is skipped.
          3. Press step 2 to create the PROJEX database, apply migrations and start the PROJEX API Windows service. Passwords are generated automatically and stored encrypted by Windows.
          4. When the Status page shows green, double-click Start-PROJEX.bat to open the Desktop program.
          Start-PROJEX.bat checks the local API/database first. If they are not ready it opens Server Control Center instead. Settings and setup logs are stored in Server\Settings.

          CLIENT COMPUTERS
          Copy the complete Clients folder to the client computer, right-click Setup-Client.bat and choose Run as administrator. The server address is filled in automatically when the server administrator saved it in the Clients page. Client computers do not need PostgreSQL or the API service.

          MULTI-DEVICE SECURITY
          The API starts in loopback-only mode. On the dedicated server, open Start-PROJEX-Server-Setup.bat, go to the Clients page and choose Enable secure access. The wizard requires a trusted PFX certificate, a DNS name that resolves to the server, and the private client subnet. It configures an HTTPS listener and a subnet-scoped Windows Firewall rule.
          Install the issuing certificate authority on each client device and use the HTTPS address shown by the wizard. Plan certificate renewal before expiry.
          Never expose PostgreSQL port 5432 or the local API HTTP port to client devices or the public Internet. Choose Disable secure LAN access to return to loopback-only mode.

          REQUIREMENTS
          Windows 10/11 x64; Windows 11 recommended. Entry target: 8 GB RAM and SSD; recommended: 16 GB RAM and SSD. No separate .NET runtime installation is required.
          See Server\Docs\CLIENT_SERVER_ARCHITECTURE.md and PRODUCT_REQUIREMENTS.md.
          '@ | Set-Content -Encoding utf8 artifacts/package/README-RUN.txt
      - name: Validate the package
        shell: pwsh
        run: |
          foreach ($required in @(
            "artifacts/package/Clients/Desktop/Projex.Desktop.exe",
            "artifacts/package/Clients/Setup-Client.bat",
            "artifacts/package/Clients/Install-PROJEX-Client.ps1",
            "artifacts/package/Server/API/Projex.Api.exe",
            "artifacts/package/Server/Manager/Projex.ServerManager.exe",
            "artifacts/package/Server/Settings/README.txt",
            "artifacts/package/Server/Scripts/Install-PROJEX-Local.ps1",
            "artifacts/package/Server/Scripts/Install-PROJEX-Server.ps1",
            "artifacts/package/Start-PROJEX.bat",
            "artifacts/package/Start-PROJEX-Server-Setup.bat",
            "artifacts/package/README-RUN.txt",
            "artifacts/package/Server/Docs/CLIENT_SERVER_ARCHITECTURE.md"
          )) {
            if (!(Test-Path $required)) { throw "Required package file is missing: $required" }
          }
          $desktopLauncher = Get-Content artifacts/package/Start-PROJEX.bat -Raw
          if ($desktopLauncher -notmatch "/health/ready" -or $desktopLauncher -notmatch "Start-PROJEX-Server-Setup.bat|Projex.ServerManager.exe") {
            throw "Start-PROJEX.bat must check API/database readiness and direct first-run users to Server Control Center."
          }
      # Upload the FOLDERS (not a ready-made zip): GitHub zips an artifact itself,
      # so uploading a zip would give a zip inside a zip.
      - name: Upload full package (server + clients)
        uses: actions/upload-artifact@v4
        with:
          name: PROJEX-Full
          path: artifacts/package
          if-no-files-found: error
          retention-days: 14
      - name: Upload clients-only package (small, for other computers)
        uses: actions/upload-artifact@v4
        with:
          name: PROJEX-Clients
          path: artifacts/package/Clients
          if-no-files-found: error
          retention-days: 14
      # Build ONE zip and attach it to a GitHub Release. Release assets are not
      # re-zipped by GitHub, so this gives a single clean PROJEX-Full-win-x64.zip.
      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/package/* -DestinationPath PROJEX-Full-win-x64.zip -Force
          $zip = Get-Item PROJEX-Full-win-x64.zip
          "{0}  {1:N1} MB" -f $zip.Name, ($zip.Length / 1MB)
          (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $zip.Name | Set-Content -Encoding ascii PROJEX-Full-win-x64.zip.sha256
      - name: Publish rolling "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $short = "${{ github.sha }}".Substring(0, 7)
          # Remove the previous release and its tag so the new one always points at this commit.
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest PROJEX-Full-win-x64.zip PROJEX-Full-win-x64.zip.sha256 `
            --title "PROJEX latest build ($short)" `
            --notes "Automated build of main at commit ${{ github.sha }}. Development preview, not a certified production release." `
            --prerelease `
            --target "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw "Creating the GitHub release failed." }
