name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (leave empty to create a build-N tag)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Restore, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Restore
        run: dotnet restore Projex.slnx

      - name: Build
        run: dotnet build Projex.slnx --configuration Release --no-restore

      - name: Test (includes PostgreSQL integration tests)
        run: dotnet test Projex.slnx --configuration Release --no-build --logger "trx;LogFileName=projex-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projex-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn
          retention-days: 14

  publish-windows:
    name: Publish Windows installer and portable package
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Restore
        run: dotnet restore Projex.slnx

      - name: Publish Desktop (self-contained win-x64)
        run: >
          dotnet publish src/Projex.Desktop/Projex.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/package/Desktop
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Publish API (self-contained win-x64)
        run: >
          dotnet publish src/Projex.Api/Projex.Api.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/package/API
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Stage server administration payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/package/ServerScripts, artifacts/package/ServerDocs | Out-Null
          Copy-Item scripts/Install-ProjexApiService.ps1, scripts/Uninstall-ProjexApiService.ps1, scripts/Test-ProjexApiService.ps1, scripts/Initialize-ProjexDatabase.ps1, scripts/Backup-ProjexDatabase.ps1, scripts/Restore-ProjexDatabase.ps1, scripts/Register-ProjexBackupTask.ps1, scripts/migrate.ps1 -Destination artifacts/package/ServerScripts
          New-Item -ItemType Directory -Force artifacts/package/ServerDatabase/Migrations | Out-Null
          Copy-Item database/migrations/*.sql -Destination artifacts/package/ServerDatabase/Migrations
          Copy-Item docs/deployment/WINDOWS_HOME_SERVER.md, docs/deployment/POSTGRES_BACKUP_RESTORE.md -Destination artifacts/package/ServerDocs

      - name: Add launch helper and package instructions
        shell: pwsh
        run: |
          @'
          @echo off
          cd /d "%~dp0Desktop"
          start "" "Projex.Desktop.exe"
          '@ | Set-Content -Encoding ascii artifacts/package/Start-PROJEX.bat

          @'
          PROJEX ENTERPRISE - Windows x64 portable package

          DESKTOP
          Double-click Start-PROJEX.bat or Desktop\Projex.Desktop.exe.
          Keep all files in the Desktop folder together.

          SERVER (optional installer component)
          The optional server component includes the API, database migrations, and setup/maintenance scripts.
          Install PostgreSQL 16 separately, then open PowerShell as Administrator and run:
          Set-Location "$env:ProgramFiles\PROJEX"
          .\Server\Scripts\Initialize-ProjexDatabase.ps1 -PublishDirectory .\Server\API
          Setup creates the database and least-privilege roles, applies migrations, generates the API key,
          protects service-specific configuration, installs the Windows service, and checks readiness.
          The setup prompts for the PostgreSQL administrator and migration-owner passwords without echoing them.
          Never expose PostgreSQL port 5432 to the public Internet.

          REQUIREMENTS
          Windows 10/11 x64. No separate .NET runtime installation is required.
          The desktop client is installed by default; the server payload is optional.
          '@ | Set-Content -Encoding utf8 artifacts/package/README-RUN.txt

      - name: Create ZIP
        shell: pwsh
        run: |
          $zip = "artifacts/PROJEX-Windows-win-x64.zip"
          Compress-Archive -Path "artifacts/package/*" -DestinationPath $zip -CompressionLevel Optimal
          if (!(Test-Path $zip)) { throw "ZIP package was not created." }
          if (!(Test-Path "artifacts/package/Desktop/Projex.Desktop.exe")) { throw "Desktop executable is missing." }
          if (!(Test-Path "artifacts/package/API/Projex.Api.exe")) { throw "API executable is missing." }

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $compiler = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler was not installed." }
          & $compiler /DMyAppVersion=0.9.2-preview.1 installer/PROJEX.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed ($LASTEXITCODE)." }
          if (!(Test-Path "artifacts/PROJEX-Setup-win-x64.exe")) { throw "Installer executable was not created." }

      - name: Determine release tag
        id: release_meta
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:EVENT_NAME -eq "push") {
            $tag = $env:REF_NAME
          } elseif (![string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            $tag = $env:INPUT_TAG.Trim()
          } else {
            $tag = "build-$($env:RUN_NUMBER)"
          }
          "tag_name=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish GitHub Release with installer and portable ZIP
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: PROJEX ${{ steps.release_meta.outputs.tag_name }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.release_meta.outputs.tag_name, 'preview') }}
          files: |
            artifacts/PROJEX-Windows-win-x64.zip
            artifacts/PROJEX-Setup-win-x64.exe
