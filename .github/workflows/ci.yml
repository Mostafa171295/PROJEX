name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json
      - name: Show SDK
        run: dotnet --info
      - name: Restore
        run: dotnet restore Projex.slnx
      - name: Build
        run: dotnet build Projex.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Projex.slnx --configuration Release --no-build --logger "trx;LogFileName=projex-tests.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projex-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn
          retention-days: 14

  postgres-backup-restore-integration:
    name: PostgreSQL backup and restore integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: ci-postgres-password
      PROJEX_BACKUP_ENCRYPTION_PASSWORD: ci-only-backup-encryption-password-strong
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL 16 client and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install --yes ca-certificates curl gnupg openssl
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Provision least-privilege roles and create migration test database
        run: |
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 \
            --command "CREATE ROLE projex_owner LOGIN PASSWORD 'ci-owner-password-strong' NOSUPERUSER NOBYPASSRLS NOCREATEROLE NOCREATEDB NOREPLICATION" \
            --command "CREATE ROLE projex_app LOGIN PASSWORD 'ci-app-password-strong' NOSUPERUSER NOBYPASSRLS NOCREATEROLE NOCREATEDB NOREPLICATION" \
            --command "CREATE DATABASE projex_ci_migrations OWNER projex_owner"
      - name: Apply all numbered application migrations
        shell: pwsh
        run: |
          $env:PGPASSWORD = "ci-owner-password-strong"
          & ./scripts/migrate.ps1 -DbHost "127.0.0.1" -Port 5432 -Database "projex_ci_migrations" -MigrationsPath "./database/migrations"
          if ($LASTEXITCODE -ne 0) { throw "Application database migrations failed." }
      - name: Verify application role grants and tenant row security
        shell: pwsh
        run: |
          $env:PGPASSWORD = "ci-app-password-strong"
          $checks = @"
          SELECT
            has_database_privilege('projex_app', 'projex_ci_migrations', 'CONNECT')
            AND NOT has_database_privilege('projex_app', 'projex_ci_migrations', 'CREATE')
            AND has_schema_privilege('projex_app', 'platform', 'USAGE')
            AND has_table_privilege('projex_app', 'platform.tenants', 'SELECT')
            AND NOT has_table_privilege('projex_app', 'platform.tenants', 'DELETE')
            AND NOT has_table_privilege('projex_app', 'identity.permissions', 'INSERT')
            AND (SELECT relrowsecurity AND relforcerowsecurity FROM pg_class WHERE oid = 'organization.companies'::regclass);
          "@
          $result = psql --host 127.0.0.1 --username projex_app --dbname projex_ci_migrations --tuples-only --no-align --set ON_ERROR_STOP=1 --command $checks
          if ($LASTEXITCODE -ne 0) { throw "Could not verify application database grants." }
          if (($result | Out-String).Trim() -ne "t") { throw "Application role grants or tenant row-level security did not match the least-privilege policy." }
          $rowCount = psql --host 127.0.0.1 --username projex_app --dbname projex_ci_migrations --tuples-only --no-align --set ON_ERROR_STOP=1 --command "SELECT count(*) FROM organization.companies"
          if ($LASTEXITCODE -ne 0) { throw "Application role could not query its tenant-scoped companies table." }
          if (($rowCount | Out-String).Trim() -ne "0") { throw "An unscoped application role unexpectedly saw tenant rows." }
          Write-Host "All application migrations, grants and tenant RLS checks passed."
      - name: Create source and restore databases
        run: |
          pg_dump --version
          if [[ "$(pg_dump --version)" != *"16."* ]]; then
            echo "Expected PostgreSQL 16 client tools to match the PostgreSQL 16 service." >&2
            exit 1
          fi
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 \
            --command "CREATE DATABASE projex_ci_source" \
            --command "CREATE DATABASE projex_ci_restore"
          psql --host 127.0.0.1 --username postgres --dbname projex_ci_source --set ON_ERROR_STOP=1 \
            --command "CREATE TABLE backup_probe (id integer PRIMARY KEY, payload text NOT NULL)" \
            --command "INSERT INTO backup_probe (id, payload) VALUES (1, 'alpha'), (2, 'beta'), (3, 'gamma')"
      - name: Back up, encrypt, verify, decrypt and restore
        shell: pwsh
        run: |
          $backupDirectory = Join-Path $env:RUNNER_TEMP "projex-backup-integration"
          & ./scripts/Backup-ProjexDatabase.ps1 -DbHost "127.0.0.1" -Port 5432 -Database "projex_ci_source" -DbUser "postgres" -BackupDirectory $backupDirectory -RetentionDays 2

          $backup = Get-ChildItem -LiteralPath $backupDirectory -Filter "*.dump.enc" -File | Select-Object -First 1
          if ($null -eq $backup) { throw "Encrypted backup archive was not created." }
          if (-not (Test-Path -LiteralPath ($backup.FullName + ".json"))) { throw "Backup manifest was not created." }

          & ./scripts/Restore-ProjexDatabase.ps1 -BackupFile $backup.FullName -TargetDatabase "projex_ci_restore" -DbHost "127.0.0.1" -Port 5432 -DbUser "postgres" -Confirm:$false

          $count = psql --host 127.0.0.1 --username postgres --dbname projex_ci_restore --tuples-only --no-align --command "SELECT count(*) FROM backup_probe"
          if ($LASTEXITCODE -ne 0) { throw "Could not query restored database." }
          if (($count | Out-String).Trim() -ne "3") { throw "Restored database row count was not 3." }
          Write-Host "PostgreSQL backup/restore integration passed: restored 3 rows."

  validate-windows-deployment:
    name: Validate Windows deployment scripts
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse PowerShell deployment scripts
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -LiteralPath "scripts" -Filter "*.ps1" -File
          if ($scripts.Count -eq 0) { throw "No PowerShell deployment scripts were found." }
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error }
            Write-Host "PowerShell syntax is valid: $($script.Name)"
          }
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore desktop tests
        run: dotnet restore tests/Projex.Desktop.Tests/Projex.Desktop.Tests.csproj
      - name: Build desktop tests on Windows
        run: dotnet build tests/Projex.Desktop.Tests/Projex.Desktop.Tests.csproj --configuration Release --no-restore
      - name: Run desktop connection tests on Windows
        run: dotnet test tests/Projex.Desktop.Tests/Projex.Desktop.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=desktop-connection-tests.trx"
